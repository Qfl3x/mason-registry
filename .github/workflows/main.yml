name: debug-jetls-win
on: workflow_dispatch

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aviatesk/JETLS.jl
          ref: 2026-09-06
          path: jetls-src

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'   # match whatever you're targeting

      - name: Run the build script logic
        working-directory: jetls-src
        shell: pwsh
        run: |
          $env:JETLS_BUILD_DIR = "$PWD"
          $env:JULIA_DEPOT_PATH = "$env:JETLS_BUILD_DIR;" + (julia -e 'print(DEPOT_PATH[end])')
          julia -e 'using Pkg; Pkg.Apps.add(path=ENV["JETLS_BUILD_DIR"])'
          
      - name: Inspect what got generated
        working-directory: jetls-src
        shell: pwsh
        run: |
          Get-ChildItem -Recurse bin
          Get-ChildItem -Recurse environments
          Get-Content -Raw (Get-ChildItem -Recurse bin -Filter "jetls*")

      - name: Try running it directly
        working-directory: jetls-src
        shell: pwsh
        run: |
          & .\bin\jetls.bat serve --help  # adjust filename once you see what's actually there
